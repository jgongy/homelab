global
	log /dev/log local0
	log /dev/log local1 notice
	chroot /var/lib/haproxy
	stats socket /run/haproxy/admin.sock mode 660 level admin
	stats timeout 30s
	user haproxy
	group haproxy
	daemon

defaults
	log global
	option httplog
	option dontlognull
	timeout connect 5000ms
	timeout client 50000ms
	timeout server 50000ms

resolvers nameservers
    nameserver ns1 10.0.0.5:53
    nameserver ns2 10.0.0.6:53

frontend http_frontend
    mode http

	bind :80
	# bind :443 ssl crt

    # Redirect HTTP to HTTPS
    # http-request redirect scheme https code 301 if !{ ssl_fc }

    acl to_openbao_cluster hdr(host) -i openbao.internal.jackie.gg

    http-request deny deny_status 404 if !to_openbao_cluster

    use_backend openbao_cluster if to_openbao_cluster

backend openbao_cluster
    mode http
	balance roundrobin
	server server1 node-00.openbao.internal.jackie.gg:8200 check resolvers nameservers ssl ca-file /usr/local/share/ca-certificates/internal-root-ca.crt
	server server2 node-01.openbao.internal.jackie.gg:8200 check resolvers nameservers ssl ca-file /usr/local/share/ca-certificates/internal-root-ca.crt
	server server3 node-02.openbao.internal.jackie.gg:8200 check resolvers nameservers ssl ca-file /usr/local/share/ca-certificates/internal-root-ca.crt
