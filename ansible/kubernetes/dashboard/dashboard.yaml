---
- hosts: control_plane
  remote_user: debian
  gather_facts: yes

  vars_files:
    - vars.yaml

  tasks:
    - name: Add Helm repository
      become: yes
      deb822_repository:
        name: helm
        types: [deb]
        architectures: [amd64]
        uris: "https://baltocdn.com/helm/stable/debian/"
        signed_by: "https://baltocdn.com/helm/signing.asc"
        suites: [all]
        components:
          - main
        state: present
        enabled: yes

    - name: Install Helm
      become: yes
      apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes
      vars:
        packages:
        - helm

    - name: Create namespace
      run_once: true
      kubernetes.core.k8s:
        name: "{{ ns }}"
        api_version: v1
        kind: Namespace
        state: present
      vars:
        ansible_python_interpreter: "{{ venv_dir }}/kubernetes/bin/python3.11"

    - name: Add Kubernetes Dashboard repository
      kubernetes.core.helm_repository:
        name: kubernetes-dashboard
        repo_url: "https://kubernetes.github.io/dashboard/"

    - name: Deploy Kubernetes Dashboard
      run_once: true
      kubernetes.core.helm:
        name: kubernetes-dashboard
        kubeconfig: "{{ ansible_env.HOME }}/.kube/config"
        chart_ref: kubernetes-dashboard/kubernetes-dashboard
        chart_version: 7.10.1
        release_namespace: "{{ ns }}"

    - name: Create a Service Account for accessing the dashboard
      run_once: true
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'service-account.j2') | from_yaml }}"
        validate:
          fail_on_error: yes
      vars:
        ansible_python_interpreter: "{{ venv_dir }}/kubernetes/bin/python3.11"

    - name: Create a Cluster Role Binding for the Service Account
      run_once: true
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'crb.j2') | from_yaml }}"
        validate:
          fail_on_error: yes
      vars:
        ansible_python_interpreter: "{{ venv_dir }}/kubernetes/bin/python3.11"

    - name: Create a long-lived API token for the Service Account
      run_once: true
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'secret.j2') | from_yaml }}"
        validate:
          fail_on_error: yes
      vars:
        ansible_python_interpreter: "{{ venv_dir }}/kubernetes/bin/python3.11"

