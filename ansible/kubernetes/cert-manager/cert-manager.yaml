---
- hosts: control_plane
  remote_user: debian
  gather_facts: yes

  vars_files:
    - vars.yaml

  tasks:
    - name: Add Helm repository
      become: yes
      deb822_repository:
        name: helm
        types: [deb]
        architectures: [amd64]
        uris: "https://baltocdn.com/helm/stable/debian/"
        signed_by: "https://baltocdn.com/helm/signing.asc"
        suites: [all]
        components:
          - main
        state: present
        enabled: yes

    - name: Install Helm
      become: yes
      apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes
      vars:
        packages:
        - helm

    - name: Create cert-manager namespace
      kubernetes.core.k8s:
        name: "{{ ns }}"
        api_version: v1
        kind: Namespace
        state: present
      vars:
        ansible_python_interpreter: "{{ venv_dir }}/kubernetes/bin/python3.11"

    - name: Add cert-manager repository
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: "https://charts.jetstack.io"

    - name: Install cert-manager
      run_once: true
      kubernetes.core.helm:
        name: cert-manager
        kubeconfig: "{{ ansible_env.HOME }}/.kube/config"
        chart_ref: jetstack/cert-manager
        chart_version: 1.16.3
        set_values:
          - value: "crds.enabled=true"
            value_type: raw
          - value: "config.enableGatewayAPI=true"
            value_type: raw
        release_namespace: "{{ ns }}"

    - name: Create self-signed issuer
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'selfsigned-cluster-issuer.yaml') | from_yaml }}"
        validate:
          fail_on_error: yes
      vars:
        ansible_python_interpreter: "{{ venv_dir }}/kubernetes/bin/python3.11"

