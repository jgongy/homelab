apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: cilium-l2-announcement-policy
spec:
  externalIPs: true
  # interfaces:
  # - ens19
  loadBalancerIPs: true
  nodeSelector:
    matchLabels:
      bgp-policy: "all"
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: "traefik"

