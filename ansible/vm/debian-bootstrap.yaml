---
- name: Install packages for Debian bootstrapping
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
    update_cache: true
  vars:
    packages:
      - qemu-guest-agent

- name: Start QEMU Guest Agent
  become: true
  ansible.builtin.service:
    name: qemu-guest-agent
    state: "started"
    enabled: true

# Band-aid fix for systemd-networkd-wait-online hanging.
- name: Create the directory for systemd-networkd-wait-online.service override
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d/
    state: directory
    owner: root
    group: root
    mode: "0644"

- name: Set the interface for systemd-networkd-wait-online.service
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --timeout=3 --any

- name: Copy the root certificate for the internal CA
  become: true
  ansible.builtin.copy:
    src: "{{ internal_root_ca_path }}"
    dest: "/usr/local/share/ca-certificates/internal-root-ca.crt"
    owner: root
    group: root
    mode: "0644"

- name: Update CA certificates to register the root certificate
  become: true
  ansible.builtin.command: update-ca-certificates
  changed_when: true
