---
- hosts: "nodes"
  become: yes
  gather_facts: yes

  vars_files:
    - vars.yaml

  tasks:
    - name: Install packages
      apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes
      vars:
        packages:
          - vim
          - python3.11
          - python3.11-venv
          - curl
          - gnupg-agent
          - software-properties-common
          - tmux
          - sudo
          # TODO: Uncomment when it's figured out how to not install for Pi
          # - libguestfs-tools # necessary for virt-customize

    # TODO: Get these steps to not run on Pi devices
    - name: Add Terraform apt repository
      deb822_repository:
        name: terraform
        types: [deb]
        uris: "https://apt.releases.hashicorp.com"
        signed_by: "https://apt.releases.hashicorp.com/gpg"
        suites: [bookworm]
        components:
          - main
        state: present
        enabled: yes

    - name: Install Terraform
      apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes
      vars:
        packages:
          - terraform

    - name: Create Ansible virtual environment
      pip:
        name: "{{ packages }}"
        virtualenv: "{{ venv_dir }}/ansible"
        virtualenv_command: "python3.11 -m venv"
      vars:
        packages:
          - ansible

