---
- name: "Set up repositories and install packages"
  hosts: "nodes"
  become: true
  gather_facts: true

  vars_files:
    - vars.yaml

  tasks:
    - name: Add Debian repo with non-free firmware
      ansible.builtin.deb822_repository:
        name: debian
        types: deb
        uris: http://deb.debian.org/debian
        signed_by: "/usr/share/keyrings/debian-archive-keyring.gpg"
        suites: [trixie]
        components:
          - main
          - contrib
          - non-free-firmware

    - name: Add Tailscale apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: [deb]
        uris: "https://pkgs.tailscale.com/stable/debian"
        signed_by: "https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg"
        suites: [trixie]
        components:
          - main
        state: present
        enabled: true

    - name: Install packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: true
      vars:
        packages:
          - vim
          - curl
          - gnupg-agent
          - software-properties-common
          - tmux
          - sudo
          - corosync-qdevice
          - tailscale
          - networkd-dispatcher

    - name: Display CPU Vendor
      ansible.builtin.debug:
        # Vendor ID is typically at index 1
        msg: "CPU Vendor for {{ inventory_hostname }}: {{ ansible_processor[1] }}"

    - name: Install Intel microcode
      ansible.builtin.apt:
        name: intel-microcode
        state: present
        update_cache: true
      when: "'Intel' in ansible_processor[1]"

    - name: Install AMD microcode
      ansible.builtin.apt:
        name: amd64-microcode
        state: present
        update_cache: true
      when: "'AMD' in ansible_processor[1]"
