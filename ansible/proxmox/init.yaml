---
- hosts: "nodes"
  become: yes
  gather_facts: yes

  vars_files:
      - vars.yaml

  tasks:
    
    - name: Copy authorized_keys onto the machine
      copy:
        src: "{{ lookup('env', 'HOME') }}/.ssh/{{ item.src }}"
        dest: "{{ ansible_env.HOME }}/.ssh/{{ item.dest }}"
        force: true
        mode: 0400
      loop:
        - src: authorized_keys
          dest: authorized_keys

    - name: Copy dotfiles
      copy:
        src: "{{ lookup('env', 'HOME') }}/github/dotfiles/{{ item }}"
        dest: "{{ ansible_env.HOME }}/"
      loop:
        - .bashrc
        - .inputrc
        - .vimrc
        - .tmux.conf

