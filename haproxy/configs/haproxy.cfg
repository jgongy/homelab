global
  log /dev/log local0
 	log /dev/log local1 notice
 	chroot /var/lib/haproxy
 	stats socket /run/haproxy/admin.sock mode 660 level admin
 	stats timeout 30s
 	user haproxy
 	group haproxy
 	daemon

defaults
 	log global
 	option tcplog
 	option dontlognull
 	timeout connect 5000ms
 	timeout client 50000ms
 	timeout server 50000ms

resolvers dns
    nameserver ns1 10.0.0.5:53
    nameserver ns2 10.0.0.6:53

frontend ssl_passthrough_frontend
  mode tcp
  
  bind :80
  bind :443
  
  tcp-request inspect-delay 5s
  tcp-request content accept if { req_ssl_hello_type 1 }

  acl to_openbao_cluster req.ssl_sni -i openbao.internal.jackie.gg
  acl to_proxmox req.ssl_sni -i proxmox.internal.jackie.gg

  use_backend openbao_cluster if to_openbao_cluster
  use_backend proxmox if to_proxmox
  
  default_backend no-match

backend openbao_cluster
  mode tcp
  balance roundrobin
  stick-table type ip size 1m expire 1h
  stick on src

  server openbao-00 node-00.openbao.internal.jackie.gg:8200 check resolvers dns
  server openbao-01 node-01.openbao.internal.jackie.gg:8200 check resolvers dns
  server openbao-02 node-02.openbao.internal.jackie.gg:8200 check resolvers dns

backend proxmox
  mode tcp
  balance roundrobin
  stick-table type ip size 1m expire 1h
  stick on src

  server beelink-eq14-1 beelink-eq14-1.proxmox.internal.jackie.gg:8006     check resolvers dns
  server beelink-eq14-2 beelink-eq14-2.proxmox.internal.jackie.gg:8006     check resolvers dns
  server hp-prodesk-600-1 hp-prodesk-600-1.proxmox.internal.jackie.gg:8006 check resolvers dns
  server hp-prodesk-600-2 hp-prodesk-600-2.proxmox.internal.jackie.gg:8006 check resolvers dns
  server hp-prodesk-600-3 hp-prodesk-600-3.proxmox.internal.jackie.gg:8006 check resolvers dns
  server hp-envy hp-envy.proxmox.internal.jackie.gg:8006                   check resolvers dns

backend no-match
  mode http
  option httplog

  http-request deny deny_status 404
 
