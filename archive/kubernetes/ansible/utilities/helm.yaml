---
- hosts: control_plane
  remote_user: debian
  gather_facts: yes

  vars_files:
    - vars.yaml

  tasks:
    - name: Add Helm repository
      become: yes
      deb822_repository:
        name: helm
        types: [deb]
        architectures: [amd64]
        uris: "https://baltocdn.com/helm/stable/debian/"
        signed_by: "https://baltocdn.com/helm/signing.asc"
        suites: [all]
        components:
          - main
        state: present
        enabled: yes

    - name: Install Helm
      become: yes
      apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes
      vars:
        packages:
        - helm

