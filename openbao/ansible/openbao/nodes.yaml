---
- name: "Create the OpenBao cluster"
  hosts: nodes
  gather_facts: true

  vars_files:
    - vars.yaml

  tasks:
    - name: Retrieve the unseal token generated by the operator
      ansible.builtin.set_fact:
        autounseal_token: "{{ lookup('file', '{{ vars.secrets_dir }}/cluster_autounseal.txt') }}"

    - name: Copy the config file to the remote machine
      become: true
      ansible.builtin.template:
        src: "../../configs/nodes.hcl.j2"
        dest: "/etc/openbao/openbao.hcl"
        owner: openbao
        group: openbao
        mode: "0644"

    - name: Start OpenBao
      become: true
      ansible.builtin.service:
        name: openbao
        state: "started"
        enabled: true

    - name: Check if OpenBao is initialized
      ansible.builtin.command:
        argv:
          - "bao"
          - "operator"
          - "init"
          - "-status"
      environment:
        VAULT_ADDR: "https://{{ ansible_host }}:8200"
      register: is_initialized
      # An exit code of 2 is not an error but a sign for uninitialized
      failed_when: is_initialized.rc == 1
      changed_when: false

    # Only one of the nodes needs to be initialized and the remaining nodes
    # will join afterwards.
    - name: Initialize the first OpenBao node
      ansible.builtin.import_tasks:
        file: ./init.yaml
      environment:
        VAULT_ADDR: "https://{{ ansible_host }}:8200"
      when:
        - groups['nodes'].index(inventory_hostname) == 0
        # An exit code of 2 is not an error but a sign for uninitialized
        - is_initialized.rc == 2
      # If the first node fails to initialize we should not continue.
      any_errors_fatal: true

    - name: Set the name of the initial node in the cluster
      ansible.builtin.set_fact:
        initial_node: "{{ groups['nodes'][0] }}"

    - name: Join other nodes to create the cluster
      ansible.builtin.command:
        argv:
          - "bao"
          - "operator"
          - "raft"
          - "join"
          - "https://{{ hostvars[initial_node]['ansible_host'] }}:8200"
      environment:
        VAULT_ADDR: "https://{{ ansible_host }}:8200"
      when:
        - groups['nodes'].index(inventory_hostname) != 0
        # An exit code of 2 is not an error but a sign for uninitialized
        - is_initialized.rc == 2
      changed_when: is_initialized.rc == 2
